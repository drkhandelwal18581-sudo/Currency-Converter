<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Currency Converter</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input, select, button {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    .result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
      text-align: center;
    }

    .loading {
      text-align: center;
      color: #555;
    }

    .error {
      color: red;
      text-align: center;
    }

    @media (max-width: 500px) {
      .container {
        margin: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Currency Converter</h2>

    <input type="number" id="amount" placeholder="Enter amount" />

    <select id="fromCurrency"></select>
    <select id="toCurrency"></select>

    <button onclick="convertCurrency()">Convert</button>

    <div id="status" class="loading"></div>
    <div id="result" class="result"></div>
    <div id="error" class="error"></div>
  </div>

  <script>
    const apiURL = "https://api.exchangerate-api.com/v4/latest/USD";
    let rates = {};

    const fromCurrency = document.getElementById("fromCurrency");
    const toCurrency = document.getElementById("toCurrency");
    const status = document.getElementById("status");
    const result = document.getElementById("result");
    const error = document.getElementById("error");

    async function loadCurrencies() {
      try {
        status.textContent = "Loading currencies...";
        error.textContent = "";

        const res = await fetch(apiURL);
        const data = await res.json();

        if (!data || !data.rates) throw new Error("Invalid API response");

        rates = data.rates;

        const currencies = Object.keys(rates);

        currencies.forEach(currency => {
          fromCurrency.innerHTML += `<option value="${currency}">${currency}</option>`;
          toCurrency.innerHTML += `<option value="${currency}">${currency}</option>`;
        });

        fromCurrency.value = "USD";
        toCurrency.value = "INR";

        status.textContent = "";
      } catch (err) {
        status.textContent = "";
        error.textContent = "Failed to load currencies. Please try again.";
        console.error(err);
      }
    }

    async function convertCurrency() {
      const amount = document.getElementById("amount").value;

      if (!amount || amount <= 0) {
        error.textContent = "Please enter a valid amount";
        result.textContent = "";
        return;
      }

      try {
        status.textContent = "Converting...";
        error.textContent = "";
        result.textContent = "";

        // Fetch latest rates again (real-time)
        const res = await fetch(apiURL);
        const data = await res.json();

        if (!data || !data.rates) throw new Error("Invalid API");

        const from = fromCurrency.value;
        const to = toCurrency.value;

        const rateFromUSD = data.rates[from];
        const rateToUSD = data.rates[to];

        if (!rateFromUSD || !rateToUSD) {
          throw new Error("Currency not supported");
        }

        // Convert logic
        const usdAmount = amount / rateFromUSD;
        const converted = usdAmount * rateToUSD;

        result.textContent = `${amount} ${from} = ${converted.toFixed(2)} ${to}`;
        status.textContent = "";

      } catch (err) {
        status.textContent = "";
        error.textContent = "Conversion failed. Check your connection.";
        console.error(err);
      }
    }

    loadCurrencies();
  </script>

</body>
</html>
